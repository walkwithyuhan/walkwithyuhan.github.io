<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Make a constellation · An afternoon with Yuhan</title><link rel="icon" href="../icon.svg"><link rel="stylesheet" href="constellation.css"></head>
<body><header><a href="../">✳ mini yuhan</a><span>A LITTLE EXPERIMENT</span></header><main><div class="title"><span class="kicker">A FEW STARS. ENDLESS POSSIBILITIES.</span><h1>Make a constellation.</h1><p>Pick a star, then another. See what your sky becomes.</p></div><div class="sky" id="sky"><svg viewBox="0 0 1000 560" preserveAspectRatio="none" aria-hidden="true" id="lines"></svg><div id="stars" role="group" aria-label="Stars to connect"></div><div class="sky-caption" aria-live="polite" id="caption">Your sky is waiting.</div></div><div class="toolbar"><div class="tools"><button id="undo" disabled>Undo</button><button id="clear" disabled>Start again</button><button id="shuffle">A new sky</button></div><button id="download" disabled>Save my constellation</button></div><label class="name-label" for="name">Every constellation needs a name.</label><input id="name" placeholder="Something only you would name it…" maxlength="60" autocomplete="off"><p class="footnote">No right shape. No wrong turns. Just your little corner of the cosmos.</p></main><footer>Made in Yuhan’s little afternoon <span>✧</span></footer><script src="constellation.js"></script></body></html>
